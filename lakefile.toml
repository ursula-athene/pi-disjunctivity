name = "pi-disjunctivity"
version = "0.1.0"
license = "MIT"
keywords = ["math"]
defaultTargets = ["PiDisjunctivity"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# The standard set enables the header check; require our SPDX license line.
weak.linter.style.header.license = "SPDX-License-Identifier: MIT"
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.37.0-rc1"

[[lean_lib]]
name = "PiDisjunctivity"
