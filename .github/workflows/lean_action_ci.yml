name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.13"
          python-version: "3.13"
      - name: Install locked process tools
        run: uv sync --locked
      - name: Test offline process utilities
        run: uv run --locked --offline python -m unittest discover -s tests -v
      - name: Check documentation and active prompt links
        run: uv run --locked --offline python tools/check_docs.py

  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
      - name: Check formulation statements and axioms
        run: lake env lean Test.lean

  docs:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment: github-pages

    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
      - uses: leanprover-community/docgen-action@v1
        with:
          # docs/ contains project notes, not a Jekyll site. Use a fresh output
          # folder outside the checkout and Lake cache to skip Jekyll detection.
          homepage: ${{ runner.temp }}/pi-disjunctivity-pages
